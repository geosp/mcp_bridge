name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: mcp-bridge-linux-x86_64
            exe_name: mcp-bridge
          - os: macos-13
            artifact: mcp-bridge-macos-x86_64
            exe_name: mcp-bridge
          - os: macos-latest
            artifact: mcp-bridge-macos-arm64
            exe_name: mcp-bridge
          - os: windows-latest
            artifact: mcp-bridge-windows-x86_64.exe
            exe_name: mcp-bridge.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package and PyInstaller
        run: pip install pyinstaller .

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --onefile --name mcp-bridge \
            --collect-all httpx \
            --hidden-import httpx._transports.default \
            --hidden-import click \
            entrypoint.py
          mv dist/mcp-bridge dist/${{ matrix.artifact }}
          chmod +x dist/${{ matrix.artifact }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --name mcp-bridge `
            --collect-all httpx `
            --hidden-import httpx._transports.default `
            --hidden-import click `
            entrypoint.py
          mv dist/mcp-bridge.exe dist/${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
